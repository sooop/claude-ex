<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우편번호 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --soft:#F5F6F8; --ink:#18212B; --muted:#5C6773; --line:#D5DAE0;
  --accent:#C8202F; --accent-ink:#FFFFFF; --accent-soft:#FBE9EB;
  --ok:#1E7A4F; --ok-bg:#E4F4EC; --warn:#8A5200; --warn-bg:#FFF1D6; --err:#B3261E; --err-bg:#FCE8E6;
  --focus:#1F5FBF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161B; --panel:#1B2128; --soft:#20272F; --ink:#E6EAEE; --muted:#98A3AE; --line:#2F3741;
    --accent:#E5484D; --accent-ink:#1B1013; --accent-soft:#3A1D21;
    --ok:#5CC48F; --ok-bg:#16301F; --warn:#E3B15A; --warn-bg:#3A2E12; --err:#F2766F; --err-bg:#3A1C1A;
    --focus:#7FB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B; --panel:#1B2128; --soft:#20272F; --ink:#E6EAEE; --muted:#98A3AE; --line:#2F3741;
  --accent:#E5484D; --accent-ink:#1B1013; --accent-soft:#3A1D21;
  --ok:#5CC48F; --ok-bg:#16301F; --warn:#E3B15A; --warn-bg:#3A2E12; --err:#F2766F; --err-bg:#3A1C1A;
  --focus:#7FB0FF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.num,.zip,.boxes,td.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sources{margin:14px 0 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted);list-style:none}
.sources li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.sources .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.sources .ok .dot{background:var(--ok)} .sources .off .dot{background:var(--err)} .sources .wait .dot{background:var(--warn)}
.sources b{color:var(--ink);font-weight:500}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:13.5px;background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner[hidden]{display:none}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;margin-bottom:-1px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{background:var(--panel);border:0;padding:6px 16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.grid{display:grid;grid-template-columns:150px 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:38px}
textarea{min-height:120px;resize:vertical;font-family:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px;min-height:36px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(.94)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:13px;min-height:1px;margin-top:4px}
.hint{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.notice{padding:9px 12px;border-radius:8px;font-size:13.5px;margin:0 0 12px;background:var(--soft)}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.err{background:var(--err-bg);color:var(--err)}
.cand{display:grid;grid-template-columns:auto 64px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.cand:hover{background:var(--soft)}
.cand.on{border-color:var(--accent);background:var(--accent-soft)}
.cand input{margin-top:5px}
.cand .zip{font-weight:600;font-size:16px}
.cand .addr b{font-weight:500}
.cand .addr small{display:block;color:var(--muted);font-size:12.5px}
.cand .tag{font-size:12px;color:var(--muted);white-space:nowrap}
details.more{margin:6px 0 12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:4px 0}
.label{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:14px;margin:14px 0 10px}
.boxes{display:flex;gap:4px}
.boxes span{width:34px;height:42px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:600;color:var(--accent)}
.label .l1{font-weight:500}
.label .l2{color:var(--muted);font-size:13px}
.copybar{display:flex;gap:8px;flex-wrap:wrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:500;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap}
td select{min-height:32px;padding:3px 6px}
.small{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.editor{background:var(--soft);padding:12px}
.editor .grid{grid-template-columns:1fr 1fr}
@media (max-width:620px){.editor .grid{grid-template-columns:1fr}}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
#fallback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
#fallback[hidden]{display:none}
#fallback .box{background:var(--panel);border-radius:10px;padding:16px;max-width:560px;width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우편번호 변환기</h1>
    <p class="sub">6자리 우편번호와 주소로 도로명 주소를 찾습니다</p>
    <p class="small" id="extStatus" style="margin-top:4px"></p>
    <p class="small" style="margin-top:4px"><label for="aiTier">AI 모델</label> <select id="aiTier" data-act="ai-tier" style="width:auto;min-height:28px;padding:2px 6px;font-size:13px"><option value="quick">Haiku (기본)</option><option value="default">Sonnet</option></select></p>
    <ul class="sources" id="sources" aria-label="조회 경로 상태"></ul>
    <div class="banner" id="banner" hidden></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="화면">
    <button role="tab" id="tb-search" data-act="tab" data-tab="search" aria-selected="true">검색</button>
    <button role="tab" id="tb-learn" data-act="tab" data-tab="learn" aria-selected="false">학습 관리 <span class="badge num" id="learnCount">0</span></button>
    <button role="tab" id="tb-backup" data-act="tab" data-tab="backup" aria-selected="false">백업과 복원</button>
  </nav>

  <!-- 검색 -->
  <section id="tab-search" aria-labelledby="tb-search">
    <div class="seg" role="group" aria-label="입력 방식">
      <button data-act="mode" data-mode="single" aria-pressed="true">단건</button>
      <button data-act="mode" data-mode="batch" aria-pressed="false">일괄</button>
    </div>

    <div id="m-single">
      <div class="panel">
        <div class="grid">
          <div class="full">
            <label class="f" for="oldIn">우편번호와 주소</label>
            <input type="text" id="oldIn" autocomplete="off" placeholder="123-456 서울시 강남구 역삼동 736-1">
          </div>
          <input type="hidden" id="addr2">
        </div>
        <div class="err" id="zipErr" role="alert"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" data-act="search">검색</button>
          <button class="btn" data-act="clear-single">입력 지우기</button>
        </div>
      </div>
      <div id="result" aria-live="polite"></div>
    </div>

    <div id="m-batch" hidden>
      <div class="panel">
        <label class="f" for="batchIn">한 줄에 한 건씩 붙여넣기 (탭, 쉼표, 공백 구분 자동 인식)</label>
        <textarea id="batchIn" placeholder="123-456 서울시 강남구 역삼동 736-1&#10;123456,경기도 성남시 분당구 정자동 178-1"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn" data-act="batch-parse">미리보기</button>
          <button class="btn primary" data-act="batch-run" id="batchRun">조회 실행</button>
          <button class="btn" data-act="batch-stop" id="batchStop" hidden>중지</button>
          <button class="btn" data-act="batch-clear">목록 지우기</button>
        </div>
        <div class="bar" id="batchBar" hidden><i></i></div>
        <div class="small" id="batchSummary" style="margin-top:6px"></div>
      </div>
      <div id="batchTable"></div>
      <div class="row" id="batchActions" style="margin-top:12px" hidden>
        <button class="btn" data-act="batch-retry">실패 건 다시 조회</button>
        <button class="btn" data-act="batch-auto" id="batchAuto">신뢰도 높음 후보로 일괄 확정</button>
        <button class="btn" data-act="batch-copy-json" id="batchCopyJson">JSON 복사</button>
        <button class="btn" data-act="batch-copy-tsv" id="batchCopyTsv">TSV 복사</button>
      </div>
    </div>
  </section>

  <!-- 학습 관리 -->
  <section id="tab-learn" hidden aria-labelledby="tb-learn">
    <div class="panel">
      <div class="row">
        <input type="search" id="learnQ" placeholder="구우편번호, 주소, 새우편번호로 검색" style="flex:1;min-width:200px;width:auto" aria-label="학습 목록 검색">
        <select id="learnSort" style="width:auto" aria-label="정렬">
          <option value="updated">최근 수정순</option>
          <option value="hits">사용 횟수순</option>
          <option value="zip">구우편번호순</option>
        </select>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn danger sm" data-act="learn-del" id="learnDel" disabled>선택 삭제</button>
        <button class="btn sm" data-act="learn-reset-open">전체 초기화</button>
        <span class="small" id="learnInfo"></span>
      </div>
      <div id="resetBox" class="notice err" hidden style="margin-top:10px">
        <p>학습된 데이터 <b class="num" id="resetN">0</b>건을 모두 삭제합니다. 되돌릴 수 없으니 먼저 백업을 내보내세요.</p>
        <div class="row" style="margin-top:8px">
          <input type="text" id="resetConfirm" placeholder="삭제 라고 입력" style="width:160px" aria-label="확인 문구">
          <button class="btn danger sm" data-act="learn-reset">초기화 실행</button>
          <button class="btn sm" data-act="tab" data-tab="backup">백업 탭으로</button>
          <button class="btn sm" data-act="learn-reset-cancel">취소</button>
        </div>
      </div>
    </div>
    <div id="learnList"></div>
  </section>

  <!-- 백업과 복원 -->
  <section id="tab-backup" hidden aria-labelledby="tb-backup">
    <div class="panel">
      <h2>내보내기</h2>
      <p class="hint" id="backupInfo"></p>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" data-act="export-file">JSON 파일로 내보내기</button>
        <button class="btn" data-act="export-text">텍스트로 보기</button>
      </div>
      <div id="exportBox" hidden style="margin-top:10px">
        <textarea id="exportText" readonly aria-label="내보낸 JSON"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn sm" data-act="export-copy">복사</button></div>
      </div>
    </div>
    <div class="panel">
      <h2>가져오기</h2>
      <div class="row">
        <input type="file" id="impFile" accept=".json,application/json" aria-label="백업 파일 선택">
      </div>
      <label class="f" for="impText" style="margin-top:10px">또는 JSON 붙여넣기</label>
      <textarea id="impText" placeholder='{"app":"postal-converter", ...}'></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" data-act="imp-check">검증하고 미리보기</button>
      </div>
      <div id="impPreview" style="margin-top:12px"></div>
    </div>
    <div id="undoBox"></div>
  </section>
</div>

<div class="wrap" style="padding-top:0">
  <details class="panel" id="diag">
    <summary>연동 진단 (임시)</summary>
    <div id="diagBody" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="diag-ping">ping 보내기</button><button class="btn sm" data-act="diag-clear">기록 지우기</button></div>
  </details>
</div>
<div id="toast" role="status"></div>
<div id="fallback" hidden>
  <div class="box">
    <p style="margin-bottom:8px">자동 복사가 막혀 있습니다. 아래 텍스트를 직접 선택해 복사하세요.</p>
    <textarea id="fbText" readonly aria-label="복사할 텍스트"></textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn" data-act="fb-close">닫기</button></div>
  </div>
</div>

<script>
//#PURE-START
const SIDO={
  '서울':'서울특별시','서울시':'서울특별시','서울특별시':'서울특별시',
  '부산':'부산광역시','부산시':'부산광역시','부산광역시':'부산광역시',
  '대구':'대구광역시','대구시':'대구광역시','대구광역시':'대구광역시',
  '인천':'인천광역시','인천시':'인천광역시','인천광역시':'인천광역시',
  '광주광역시':'광주광역시',
  '대전':'대전광역시','대전시':'대전광역시','대전광역시':'대전광역시',
  '울산':'울산광역시','울산시':'울산광역시','울산광역시':'울산광역시',
  '세종':'세종특별자치시','세종시':'세종특별자치시','세종특별자치시':'세종특별자치시',
  '경기':'경기도','경기도':'경기도',
  '강원':'강원특별자치도','강원도':'강원특별자치도','강원특별자치도':'강원특별자치도',
  '충북':'충청북도','충청북도':'충청북도','충남':'충청남도','충청남도':'충청남도',
  '전북':'전북특별자치도','전라북도':'전북특별자치도','전북특별자치도':'전북특별자치도',
  '전남':'전라남도','전라남도':'전라남도',
  '경북':'경상북도','경상북도':'경상북도','경남':'경상남도','경상남도':'경상남도',
  '제주':'제주특별자치도','제주도':'제주특별자치도','제주특별자치도':'제주특별자치도'
};
const SIDO_SET=new Set(Object.values(SIDO));

function normZip(raw){
  const d=String(raw||'').replace(/\D/g,'');
  if(!d) return {empty:true};
  if(d.length===6) return {ok:true,zip:d};
  if(d.length===5) return {ok:false,warn:'5자리는 새우편번호로 보입니다. 구우편번호는 6자리 숫자입니다.'};
  return {ok:false,warn:'구우편번호는 6자리 숫자여야 합니다.'};
}
function fmt6(z){return z&&z.length===6?z.slice(0,3)+'-'+z.slice(3):(z||'')}
function recId(zip,key){return (zip||'')+'|'+(key||'')}

function normAddr(raw){
  let s=String(raw||'').normalize('NFKC').replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ').replace(/[,;]/g,' ');
  s=s.replace(/(\d)\s*번지/g,'$1 ').replace(/(\d+)\s*-\s*(\d+)/g,'$1-$2').replace(/산\s+(\d)/g,'산$1');
  let tokens=s.split(/\s+/).filter(Boolean);
  if(tokens[0]==='광주') tokens[0]='광주광역시';
  else if(tokens[0]==='광주시') tokens.unshift('경기도');
  tokens=tokens.map(t=>SIDO[t]||t);
  const isLoc=t=>/[가-힣]/.test(t)&&/[동리가읍면]$/.test(t);
  const bunRe=/^(산)?(\d+)(?:-(\d+))?$/;
  let end=-1;
  for(let i=0;i<tokens.length;i++){
    if(isLoc(tokens[i])){ let j=i; while(j+1<tokens.length&&isLoc(tokens[j+1])) j++; end=j; break; }
  }
  if(end<0){
    for(let i=0;i<tokens.length;i++){
      if(/[가-힣\d](로|길)$/.test(tokens[i])){ end=i; while(end+1<tokens.length&&/[가-힣\d]길$/.test(tokens[end+1])) end++; break; }
    }
  }
  let bunIdx=-1;
  if(end>=0&&tokens[end+1]&&bunRe.test(tokens[end+1])) bunIdx=end+1;
  const last=bunIdx>=0?bunIdx:(end>=0?end:tokens.length-1);
  const head=tokens.slice(0,last+1);
  let main='',sub='',san=false;
  if(bunIdx>=0){const m=tokens[bunIdx].match(bunRe); san=!!m[1]; main=m[2]; sub=m[3]||'';}
  return {
    key:head.join(' '), tokens, head, rest:tokens.slice(last+1).join(' '),
    sigungu:head.filter(t=>/[가-힣](시|군|구)$/.test(t)&&!SIDO_SET.has(t)),
    dongs:head.filter(isLoc), main, sub, san, hasAddr:tokens.length>0, hasBun:bunIdx>=0
  };
}

function plainCand(c){
  const o={zip5:c.zip5,road:c.road};
  if(c.jibun) o.jibun=c.jibun; if(c.detail) o.detail=c.detail; if(c.confidence) o.confidence=c.confidence;
  return o;
}
function cleanCand(c){
  if(!c||typeof c!=='object') return null;
  const zip5=String(c.zip5??'').trim(), road=String(c.road??'').trim();
  if(!/^\d{5}$/.test(zip5)||!road||road.length>300) return null;
  const o={zip5,road};
  if(c.jibun) o.jibun=String(c.jibun).trim().slice(0,300);
  if(c.detail) o.detail=String(c.detail).trim().slice(0,300);
  if(['high','medium','low'].includes(c.confidence)) o.confidence=c.confidence;
  return o;
}
function mergeCands(a,b){
  const seen=new Set(), out=[];
  for(const c of [...(a||[]),...(b||[])]){ const k=c.zip5+'|'+c.road; if(!seen.has(k)){seen.add(k); out.push(c);} }
  return out;
}

function scoreCandidate(c,q){
  if(!q.hasAddr) return 0;
  const hay=[c.jibun,c.road,c.detail].filter(Boolean).join(' ');
  for(const sg of q.sigungu){ if(!hay.includes(sg)) return -1; }
  let sc=0;
  for(const d of q.dongs){
    const dd=d.replace(/\d/g,'');
    if(hay.includes(d)) sc+=3; else if(dd.length>1&&hay.includes(dd)) sc+=2;
  }
  if(q.main){
    const toks=String(c.jibun||'').split(/\s+/).map(t=>t.match(/^(산)?(\d+)(?:-(\d+))?$/)).filter(Boolean);
    const hit=toks.find(m=>m[2]===q.main&&!!m[1]===q.san);
    if(hit){ if(q.sub) sc+=(hit[3]===q.sub)?5:2; else sc+=4; }
  }
  if(sc>0) sc+=({high:2,medium:1})[c.confidence]||0;
  return sc;
}
function rankCandidates(cands,q){
  const scored=cands.map((c,i)=>({c,i,s:scoreCandidate(c,q)}));
  if(!q.hasAddr) return {main:cands.slice(),extras:[]};
  const sorter=(a,b)=>b.s-a.s||a.i-b.i;
  const main=scored.filter(x=>x.s>0).sort(sorter).map(x=>x.c);
  const extras=scored.filter(x=>x.s<=0).sort(sorter).map(x=>({...x.c,_tag:x.s<0?'시군구 불일치':''}));
  return {main,extras};
}

function parseLine(line){
  const t=String(line).trim().replace(/^["']|["']$/g,'');
  let zip='',addr='';
  if(/^\d{3}-?\d{3}$/.test(t)) return {zipRaw:t,addrRaw:''};
  if(t.includes('\t')){
    const parts=t.split('\t').map(x=>x.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
    const zi=parts.findIndex(p=>/^\d{3}-?\d{3}$/.test(p));
    if(zi>=0){zip=parts[zi]; addr=parts.filter((_,i)=>i!==zi).join(' ');} else addr=parts.join(' ');
  } else {
    const m=t.match(/^["']?(\d{3}-?\d{3})["']?\s*[,\s]\s*(.*)$/);
    if(m){zip=m[1]; addr=m[2];} else {
      const m2=t.match(/^(.*?)[,\s]\s*["']?(\d{3}-?\d{3})["']?$/);
      if(m2){addr=m2[1]; zip=m2[2];} else addr=t;
    }
  }
  return {zipRaw:zip,addrRaw:addr.replace(/^[,\s"']+|[,\s"']+$/g,'')};
}
function parseBatch(text){
  return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,i)=>{
    const p=parseLine(l); const zr=normZip(p.zipRaw); let err='';
    if(!zr.empty&&!zr.ok) err=zr.warn; else if(zr.empty&&!p.addrRaw) err='내용이 없습니다.';
    return {n:i+1,zipRaw:p.zipRaw,addrRaw:p.addrRaw,zip:zr.ok?zr.zip:'',err};
  });
}

function parseManualPaste(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[]; let cur=null;
  const strip=s=>s.replace(/^\[?(도로명주소|도로명|지번주소|지번)\]?\s*[:：]?\s*/,'').trim();
  for(const line of lines){
    const m=line.match(/(?:^|\D)(\d{5})(?!\d)/);
    if(m){
      let rest=line.replace(m[1],' ').replace(/\s+/g,' ').trim(), jibun='', detail='';
      const jm=rest.split(/\s*\[?지번(?:주소)?\]?\s*[:：]?\s*/);
      if(jm.length>1){rest=jm[0]; jibun=jm.slice(1).join(' ').trim();}
      const pm=rest.match(/\(([^)]*)\)/);
      if(pm){detail=pm[1].trim(); rest=rest.replace(pm[0],' ').replace(/\s+/g,' ').trim();}
      cur={zip5:m[1],road:strip(rest)}; if(jibun) cur.jibun=jibun; if(detail) cur.detail=detail;
      out.push(cur);
    } else if(cur){
      const isJ=/^\[?지번/.test(line);
      const txt=strip(line);
      if(isJ&&!cur.jibun) cur.jibun=txt;
      else if(!cur.road) cur.road=txt;
      else if(!cur.jibun&&/(동|리|가)\s*\d/.test(txt)) cur.jibun=txt;
    }
  }
  return mergeCands(out.map(cleanCand).filter(Boolean),[]);
}

function learnedMatch(recs,zip,key){
  if(zip&&key){const r=recs.find(r=>r.id===recId(zip,key)); return r?{kind:'exact',recs:[r]}:{kind:'none',recs:[]};}
  if(zip){const rs=recs.filter(r=>r.oldZip===zip); return {kind:rs.length===1?'one':rs.length?'many':'none',recs:rs};}
  if(key){const rs=recs.filter(r=>r.addrKey===key); return {kind:rs.length===1?'one':rs.length?'many':'none',recs:rs};}
  return {kind:'none',recs:[]};
}

function cleanRecord(r){
  if(!r||typeof r!=='object') return null;
  const oldZip=String(r.oldZip??'').replace(/\D/g,'');
  if(oldZip&&oldZip.length!==6) return null;
  const addrKey=String(r.addrKey??'').trim();
  if(!oldZip&&!addrKey) return null;
  const selected=cleanCand(r.selected); if(!selected) return null;
  const cands=mergeCands([selected],(Array.isArray(r.candidates)?r.candidates:[]).map(cleanCand).filter(Boolean));
  const now=Date.now();
  return {id:recId(oldZip,addrKey),oldZip,addrKey,oldAddrRaw:String(r.oldAddrRaw||'').slice(0,300),selected,
    address2:String(r.address2||'').slice(0,200),candidates:cands,createdAt:Number(r.createdAt)||now,
    updatedAt:Number(r.updatedAt)||now,hits:Math.max(0,parseInt(r.hits)||0),edited:!!r.edited};
}
function validateBackup(obj){
  if(!obj||typeof obj!=='object') return {ok:false,err:'JSON 객체가 아닙니다.'};
  if(obj.app!=='postal-converter') return {ok:false,err:'이 앱의 백업 파일이 아닙니다. (app 값 불일치)'};
  if(typeof obj.schemaVersion!=='number'||obj.schemaVersion>1) return {ok:false,err:'지원하지 않는 스키마 버전입니다.'};
  if(!Array.isArray(obj.records)) return {ok:false,err:'records 배열이 없습니다.'};
  const recs=[]; let skipped=0; const seen=new Map();
  for(const r of obj.records){const c=cleanRecord(r); if(!c){skipped++; continue;} seen.set(c.id,c);}
  seen.forEach(v=>recs.push(v));
  return {ok:true,recs,skipped,dupInFile:obj.records.length-skipped-recs.length};
}
function sameRec(a,b){return a.selected.zip5===b.selected.zip5&&a.selected.road===b.selected.road&&(a.address2||'')===(b.address2||'')}
function mergeRec(file,cur,pick){
  const useFile=pick==='file'||(pick==='newer'&&file.updatedAt>=cur.updatedAt);
  const base=useFile?file:cur, other=useFile?cur:file;
  return {...base,candidates:mergeCands(base.candidates,other.candidates),hits:Math.max(file.hits,cur.hits),createdAt:Math.min(file.createdAt,cur.createdAt)};
}

/* ---- 확장 연동 프로토콜: 판정(decide) ---- */
const r3=x=>Math.round(x*1000)/1000;
const cleanText=(s,n)=>String(s==null?'':s).replace(/<[^>]*>/g,' ').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,n);
function validateDecideReq(m){
  const bad=msg=>({err:msg});
  const q=m.query;
  if(!q||typeof q!=='object') return bad('query가 없습니다');
  if(typeof q.oldAddr!=='string'||!q.oldAddr.trim()||q.oldAddr.length>200) return bad('oldAddr는 1~200자 문자열이어야 합니다');
  if(q.oldZip!=null&&!/^\d{6}$/.test(String(q.oldZip))) return bad('oldZip은 6자리 숫자여야 합니다');
  if(q.searchText!=null&&(typeof q.searchText!=='string'||q.searchText.length>200)) return bad('searchText는 200자 이하 문자열이어야 합니다');
  if(!Array.isArray(m.candidates)||m.candidates.length<1||m.candidates.length>20) return bad('candidates는 1~20건이어야 합니다');
  const refs=new Set(),cands=[];
  for(const c of m.candidates){
    if(!c||typeof c!=='object') return bad('후보 형식 오류');
    if(typeof c.ref!=='string'||!c.ref||c.ref.length>64||refs.has(c.ref)) return bad('ref가 없거나 중복되었거나 64자를 넘습니다');
    refs.add(c.ref);
    if(!/^\d{5}$/.test(String(c.zip5))) return bad('zip5는 5자리 숫자여야 합니다');
    if(typeof c.road!=='string'||!c.road.trim()||c.road.length>300) return bad('road 오류');
    for(const k of ['jibun','detail']) if(c[k]!=null&&(typeof c[k]!=='string'||c[k].length>300)) return bad(k+' 오류');
    if(c.oldZip!=null&&!/^\d{6}$/.test(String(c.oldZip))) return bad('후보 oldZip은 6자리 숫자여야 합니다');
    let prior=null;
    if(c.prior&&typeof c.prior==='object') prior={preferred:!!c.prior.preferred,confirmedCount:Math.max(0,Number(c.prior.confirmedCount)||0)};
    cands.push({ref:c.ref,zip5:String(c.zip5),road:c.road.trim(),jibun:(c.jibun||'').trim(),detail:(c.detail||'').trim(),oldZip:c.oldZip?String(c.oldZip):'',prior});
  }
  const o=(m.options&&typeof m.options==='object')?m.options:{};
  const engine=o.engine==null?'auto':o.engine;
  if(!['local','ai','auto'].includes(engine)) return bad('options.engine 오류');
  const timeoutMs=o.timeoutMs==null?60000:Number(o.timeoutMs);
  if(!(timeoutMs>=1000&&timeoutMs<=300000)) return bad('options.timeoutMs 오류');
  return {req:{query:{oldAddr:q.oldAddr.trim(),oldZip:q.oldZip?String(q.oldZip):'',searchText:q.searchText||''},cands,engine,timeoutMs}};
}
function localSignals(c,qn,oldZip){
  const hay=[c.jibun,c.road,c.detail].filter(Boolean).join(' ');
  const sig={dong:'unknown',bunji:'unknown',oldZip:'unknown'};
  let sg=false;
  for(const s of qn.sigungu){ if(!hay.includes(s)) sg=true; }
  if(qn.dongs.length){
    const hit=qn.dongs.some(d=>{const dd=d.replace(/\d/g,'');return hay.includes(d)||(dd.length>1&&hay.includes(dd));});
    if(hit) sig.dong='match'; else if(c.jibun&&/[가-힣\d](동|리|가)(\s|$)/.test(c.jibun)) sig.dong='mismatch';
  }
  if(qn.main){
    const toks=String(c.jibun||'').split(/\s+/).map(t=>t.match(/^(산)?(\d+)(?:-(\d+))?$/)).filter(Boolean);
    if(toks.length){
      const t=toks.find(m=>m[2]===qn.main&&!!m[1]===qn.san);
      sig.bunji=t?((t[3]||'')===(qn.sub||'')?'exact':'near'):'different';
    }
  }
  if(oldZip&&c.oldZip) sig.oldZip=oldZip===c.oldZip?'match':'mismatch';
  return {sig,sg};
}
function reasonOf(sig,sg){
  const p=[];
  if(sig.dong==='match') p.push('동 일치'); else if(sig.dong==='mismatch') p.push('동 불일치');
  if(sig.bunji==='exact') p.push('번지 일치'); else if(sig.bunji==='near') p.push('번지 근접(부번 다름)'); else if(sig.bunji==='different') p.push('번지 불일치');
  if(sig.oldZip==='match') p.push('구우편번호 일치'); else if(sig.oldZip==='mismatch') p.push('구우편번호 불일치');
  if(sg) p.push('시군구 불일치');
  return cleanText(p.join(', ')||'일치 근거 부족',80);
}
function finalizeDecision(raw,req,qn,summary){
  const scores=raw.map(s=>({ref:s.ref,p:Math.min(1,Math.max(0,r3(s.p))),reason:s.reason,signals:s.signals}));
  let pn=1-scores.reduce((a,s)=>a+s.p,0);
  if(pn<0){const mx=scores.reduce((a,s)=>s.p>a.p?s:a,scores[0]);mx.p=r3(mx.p+pn);pn=0;}
  pn=r3(Math.max(0,Math.min(1,pn)));
  const sorted=[...scores].sort((a,b)=>b.p-a.p);
  const top=sorted[0],second=sorted[1]?sorted[1].p:0;
  let verdict='ambiguous';
  if(pn>=0.5) verdict='no_match'; else if(top.p>=0.7&&top.p-second>=0.2) verdict='match';
  const best=req.cands.find(c=>c.ref===top.ref);
  const short=qn.head.filter(t=>!SIDO_SET.has(t)).join(' ')||req.query.oldAddr;
  let sm=cleanText(summary,200);
  if(!sm) sm=verdict==='match'?`${short} → ${best.road}${best.detail?' ('+best.detail+')':''}`:verdict==='no_match'?'일치하는 후보가 없는 것으로 판단됩니다':'후보를 하나로 좁히기 어렵습니다';
  return {scores,pNone:pn,bestRef:verdict==='no_match'?null:top.ref,verdict,summary:cleanText(sm,200),top:top.p};
}
function localDecide(req){
  const qn=normAddr(req.query.oldAddr);
  const W={dong:{match:6,mismatch:0.05,unknown:1},bunji:{exact:12,near:3,different:0.08,unknown:1},oldZip:{match:8,mismatch:0.1,unknown:1}};
  const ws=req.cands.map(c=>{
    const {sig,sg}=localSignals(c,qn,req.query.oldZip);
    let w=W.dong[sig.dong]*W.bunji[sig.bunji]*W.oldZip[sig.oldZip];
    if(sg) w*=0.02;
    if(c.prior){ if(c.prior.preferred) w*=1.2; if(c.prior.confirmedCount>0) w*=1+0.1*Math.min(c.prior.confirmedCount,5); }
    return {ref:c.ref,w,signals:sig,reason:reasonOf(sig,sg)};
  });
  const tot=ws.reduce((a,x)=>a+x.w,1.5);
  return finalizeDecision(ws.map(x=>({ref:x.ref,p:x.w/tot,reason:x.reason,signals:x.signals})),req,qn,'');
}
function validateAIScores(ai,req){
  if(!ai||typeof ai!=='object'||!Array.isArray(ai.scores)) return {err:'scores 없음'};
  const want=new Set(req.cands.map(c=>c.ref)),seen=new Map();
  for(const s of ai.scores){
    if(!s||typeof s.ref!=='string'||!want.has(s.ref)||seen.has(s.ref)) return {err:'ref 오류'};
    if(typeof s.p!=='number'||!isFinite(s.p)||s.p<0||s.p>1) return {err:'p 오류'};
    seen.set(s.ref,s);
  }
  if(seen.size!==want.size) return {err:'ref 누락'};
  if(typeof ai.pNone!=='number'||!isFinite(ai.pNone)||ai.pNone<0||ai.pNone>1) return {err:'pNone 오류'};
  const sum=ai.scores.reduce((a,s)=>a+s.p,0)+ai.pNone;
  if(Math.abs(sum-1)>0.05) return {err:'확률 합 오류'};
  return {scores:ai.scores.map(s=>({ref:s.ref,p:s.p/sum,reason:s.reason})),pNone:ai.pNone/sum,summary:typeof ai.summary==='string'?ai.summary:''};
}
function aiToDecision(chk,local,req){
  const by=new Map(local.scores.map(s=>[s.ref,s]));
  const raw=chk.scores.map(s=>({ref:s.ref,p:s.p,reason:cleanText(s.reason,80)||by.get(s.ref).reason,signals:by.get(s.ref).signals}));
  return finalizeDecision(raw,req,normAddr(req.query.oldAddr),chk.summary);
}

/* ---------------- 저장소 (IndexedDB, 실패 시 메모리) ---------------- */
const DB={mode:'idb',db:null};
const cache=new Map();
const META={lastBackupAt:0,changes:0};
function openDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('indexedDB 없음'));
    const r=indexedDB.open('postal-converter',1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains('learned')){
        const s=d.createObjectStore('learned',{keyPath:'id'});
        s.createIndex('oldZip','oldZip');s.createIndex('addrKey','addrKey');s.createIndex('updatedAt','updatedAt');
      }
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('blocked'));
  });
}
function idbRun(stores,mode,fn){
  return new Promise((res,rej)=>{
    const t=DB.db.transaction(stores,mode);let out;
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('트랜잭션 중단'));
    fn(t,v=>{out=v});
  });
}
async function storeInit(){
  try{
    DB.db=await openDB();
    const all=await idbRun('learned','readonly',(t,set)=>{const r=t.objectStore('learned').getAll();r.onsuccess=()=>set(r.result);});
    (all||[]).forEach(r=>cache.set(r.id,r));
    const metas=await idbRun('meta','readonly',(t,set)=>{const r=t.objectStore('meta').getAll();r.onsuccess=()=>set(r.result);});
    (metas||[]).forEach(m=>{if(m.key in META) META[m.key]=m.value;});
  }catch(e){DB.mode='memory';DB.err=e;}
}
async function metaSave(){
  if(DB.mode!=='idb') return;
  try{await idbRun('meta','readwrite',t=>{const s=t.objectStore('meta');s.put({key:'lastBackupAt',value:META.lastBackupAt});s.put({key:'changes',value:META.changes});});}catch(e){}
}
/* 단일 트랜잭션: opts.clear 이면 전체 삭제 후 put. 실패 시 전체 롤백(캐시도 건드리지 않음) */
async function storeApply(del,put,opts={}){
  if(DB.mode==='idb'){
    try{
      await idbRun('learned','readwrite',t=>{
        const s=t.objectStore('learned');
        if(opts.clear) s.clear();
        (del||[]).forEach(id=>s.delete(id));
        (put||[]).forEach(r=>s.put(r));
      });
    }catch(e){DB.mode='memory';DB.err=e;renderBanner();}

  { const dm=e.data; if(dm&&typeof dm==='object'&&(dm.source==='postal-bridge'||dm.source==='postal-converter')) diagLog(e,dm); }
  if(e.source!==window) return;

      BR.state='ok';renderStatus();renderSources();break;
    case 'result': case 'progress': {

function lookupBridge(q,opts,ctl,onProgress){
  return new Promise((resolve,reject)=>{
    const id=uid();
    const lim=(BR.ext&&BR.ext.limits)||{};
    const timeoutMs=opts.timeoutMs||lim.defaultTimeoutMs||15000;
    const searchText=opts.relaxed?q.nq.head.filter(t=>!/^산?\d/.test(t)&&!SIDO_SET.has(t)).join(' '):hintQuery(q);
    const query={};
    if(q.addrRaw) query.oldAddr=q.addrRaw.slice(0,200);
    if(q.zip) query.oldZip=q.zip;
    if(searchText&&searchText.length<=200) query.searchText=searchText;
    let done=false,timer;
    const onAbort=()=>{bpost({type:'cancel',id});finish(reject,{code:'cancelled'});};
    const finish=(fn,v)=>{if(done) return;done=true;clearTimeout(timer);ctl.signal.removeEventListener('abort',onAbort);BR.pending.delete(id);fn(v);};
    BR.pending.set(id,m=>{
      if(m.type==='progress'){if(onProgress&&m.stage) onProgress(String(m.stage)+(m.detail?' '+String(m.detail):''));return;}
      if(m.ok===true&&Array.isArray(m.candidates)){
        const cands=mergeCands(m.candidates.map(cleanCand).filter(Boolean),[]).slice(0,20);
        return finish(resolve,{cands,meta:(m.meta&&typeof m.meta==='object')?m.meta:{}});
      }
      if(m.ok===true) return finish(reject,{code:'bad_shape'});
      const er=m.error||{};
      finish(reject,{code:typeof er.code==='string'?er.code:'internal',message:typeof er.message==='string'?er.message:'',bridge:true});
    });
    if(ctl.signal.aborted) return onAbort();
    ctl.signal.addEventListener('abort',onAbort);
    timer=setTimeout(()=>{bpost({type:'cancel',id});finish(reject,{code:'timeout'});},timeoutMs+2000);
    bpost({type:'lookup',id,query,options:{limit:10,timeoutMs}});
  });
}

async function onDecide(m){
  if(typeof m.id!=='string'||!m.id) return;
  const reply=o=>bpost({type:'decision',id:m.id,...o});
  const fail=(code,message,retryable)=>reply({ok:false,error:{code,message,retryable}});
  if(m.v!==1) return fail('invalid_request','지원하지 않는 프로토콜 버전입니다',false);
  if(DEC.active) return fail('busy','다른 판정을 처리 중입니다',true);
  const v=validateDecideReq(m);
  if(v.err) return fail('invalid_request',v.err,false);
  const req=v.req,t0=Date.now(),ctl=new AbortController();
  let timer;
  const act=DEC.active={id:m.id,ctl,done:false};
  const finish=o=>{if(act.done) return;act.done=true;clearTimeout(timer);DEC.active=null;if(o.ok) DEC.count++;renderStatus();reply(o);};
  act.finish=finish;
  const err=(code,message,retryable)=>finish({ok:false,error:{code,message,retryable}});
  timer=setTimeout(()=>{ctl.abort();err('timeout','판정 시간이 초과되었습니다',true);},req.timeoutMs);
  renderStatus();
  try{
    bpost({type:'progress',id:m.id,stage:'scoring'});
    let res=localDecide(req),used='local';
    const needAI=req.engine==='ai'||(req.engine==='auto'&&!(res.verdict==='match'&&res.top>=0.9));
    if(needAI){
      const sample=await Promise.race([getSample(),sleep(1500).then(()=>null)]);
      if(act.done) return;
      if(!sample){
        if(req.engine==='ai') return err('ai_unavailable','AI 판정을 쓸 수 없습니다',false);
      }else{
        bpost({type:'progress',id:m.id,stage:'asking_ai'});
        try{
          const ai=await askAI(sample,req,res,ctl.signal);
          if(act.done) return;
          const chk=validateAIScores(ai,req);
          if(chk.err) throw {code:'bad_shape'};
          res=aiToDecision(chk,res,req);used='ai';
        }catch(e){
          if(act.done) return;
          if(req.engine==='ai') return err(AI_FAIL_CODES.includes(e&&e.code)?'ai_unavailable':'internal',AI_FAIL_CODES.includes(e&&e.code)?'AI 판정을 쓸 수 없습니다':'AI 응답을 처리하지 못했습니다',false);
        }
      }
    }
    if(act.done) return;
    finish({ok:true,scores:res.scores,pNone:res.pNone,bestRef:res.bestRef,verdict:res.verdict,summary:res.summary,
      meta:{engine:used,elapsedMs:Date.now()-t0,appVersion:APP_VERSION}});
  }catch(e){
    if(!act.done) err('internal','앱 내부 오류가 발생했습니다',false);
  }
}
function onDecideCancel(m){
  const a=DEC.active;
  if(!a||a.id!==m.id) return;
  a.ctl.abort();
  a.finish({ok:false,error:{code:'cancelled',message:'중단되었습니다',retryable:false}});
}

async function saveLearned(ident,cand,cands,address2,extra={}){
  const id=recId(ident.oldZip,ident.addrKey);const ex=cache.get(id);const now=Date.now();
  const sel=plainCand(cand);
  const rec={id,oldZip:ident.oldZip,addrKey:ident.addrKey,oldAddrRaw:ident.oldAddrRaw||(ex&&ex.oldAddrRaw)||'',
    selected:sel,address2:address2||'',
    candidates:mergeCands([sel],mergeCands((ex&&ex.candidates)||[],(cands||[]).map(plainCand))),
    createdAt:(ex&&ex.createdAt)||now,updatedAt:now,hits:(ex&&ex.hits)||0,edited:!!extra.edited};
  await storeApply([],[rec]);

}
async function runSingle(force){
  const q=readQuery();if(!q) return;
  $('#addr2').value=q.nq.rest||'';
  if(!force){
    const m=learnedMatch(Array.from(cache.values()),q.zip,q.nq.key);
    if(m.kind==='exact'||m.kind==='one'){return showLearned(m.recs[0],q);}
    if(m.kind==='many'){S.cur={q,source:'learned-many',recs:m.recs,cands:[],sel:-1};return renderResult();}
  }
  return doLookup(q);
}
async function showLearned(rec,q){
  const cands=mergeCands([rec.selected],rec.candidates);
  S.cur={q,source:'learned',rec,ident:{oldZip:rec.oldZip,addrKey:rec.addrKey,oldAddrRaw:rec.oldAddrRaw},cands,mainN:cands.length,sel:0,savedAddr2:rec.address2||''};
  const upd={...rec,hits:(rec.hits||0)+1};
  await storeApply([],[upd],{silent:true});

async function doLookup(q,opts={}){
  if(S.ctl) S.ctl.abort();
  const ctl=new AbortController();S.ctl=ctl;
  if(opts.via!=='claude'&&BR.state==='wait') await waitBridge(2500);
  const useBridge=opts.via!=='claude'&&bridgeReady();
  S.cur={q,ident:identOf(q),source:useBridge?'bridge':'claude',cands:[],mainN:0,sel:-1,loading:true,extrasOpen:false,notice:'',error:'',manualOpen:false,relaxed:!!opts.relaxed,progress:''};
  renderResult();
  const timer=useBridge?null:setTimeout(()=>ctl.abort(),120000);
  try{
    let list;
    if(useBridge){
      const r=await lookupBridge(q,opts,ctl,t=>{if(S.ctl===ctl&&S.cur){S.cur.progress=t;renderResult();}});
      list=r.cands;S.cur.meta=r.meta;
    }else list=await lookupClaude(q,opts,ctl);
    if(S.ctl!==ctl) return;
    const r=rankCandidates(list,q.nq);
    S.cur.cands=[...r.main,...r.extras];S.cur.mainN=r.main.length;
    S.cur.extrasOpen=r.main.length===0&&r.extras.length>0;
    suggestAddr2(q);
  }catch(e){
    if(S.ctl!==ctl) return;
    S.cur.error=errText(e);S.cur.manualOpen=true;
  }finally{if(timer) clearTimeout(timer);}
  if(S.ctl===ctl){S.cur.loading=false;renderResult();}
}

function batchParse(){
  const rows=parseBatch($('#batchIn').value).map(r=>({...r,nq:normAddr(r.addrRaw),status:r.err?'invalid':'ready',cands:[],mainN:0,sel:null,address2:'',note:r.err}));

function batchStats(){
  const st={ready:0,running:0,learned:0,pending:0,done:0,fail:0,invalid:0};
  S.batch.rows.forEach(r=>st[r.status]++);return st;
}
const autoOk=r=>r.status==='pending'&&r.mainN>0&&((r.src==='claude'&&r.cands[0].confidence==='high')||(r.src==='bridge'&&r.mainN===1));
function renderBatch(){
  const rows=S.batch.rows;const st=batchStats();
  $('#batchActions').hidden=rows.length===0;
  $('#batchRun').disabled=S.batch.running;
  $('#batchStop').hidden=!S.batch.running;

  const confirmed=st.learned+st.done;
  $('#batchSummary').textContent=`전체 ${rows.length}건 · 확정 ${confirmed} · 선택 대기 ${st.pending} · 실패 ${st.fail} · 형식 오류 ${st.invalid} · 미조회 ${st.ready+st.running}`;
  const bar=$('#batchBar');bar.hidden=!S.batch.running;
  bar.firstElementChild.style.width=(100*(rows.length-st.ready-st.running)/rows.length)+'%';
  const autoN=rows.filter(autoOk).length;

  const resCell=r=>{

    if(r.status==='fail') return `<span class="badge err">${esc(r.note||'실패')}</span>`;
    if(r.status==='ready') return '<span class="small">대기</span>';
    if(r.status==='learned'||r.status==='done'){
      return `<span class="zip num"><b>${esc(r.sel.zip5)}</b></span> ${esc(r.sel.road)} <span class="badge ${r.status==='learned'?'ok':''}">${r.status==='learned'?'학습됨':'확정'}</span> <select data-act="batch-pick" data-n="${r.n}" aria-label="후보 변경"><option value="">변경...</option>${r.cands.map((k,i)=>`<option value="${i}">${esc(k.zip5)} ${esc(k.road)}</option>`).join('')}</select>`;
    }
    return `<select data-act="batch-pick" data-n="${r.n}" aria-label="후보 선택"><option value="">선택하세요 (${r.cands.length}건)</option>${r.cands.map((k,i)=>`<option value="${i}">${esc(k.zip5)} ${esc(k.road)}${k.confidence==='high'?' [높음]':''}</option>`).join('')}</select>${r.src==='claude'?' <span class="badge warn">추정</span>':r.src==='bridge'?' <span class="badge ok">우체국</span>':''}`;
  };
  $('#batchTable').innerHTML=`<div class="tblwrap"><table><thead><tr><th>번호</th><th>구우편번호</th><th>구주소</th><th>결과</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="n">${r.n}</td><td class="num">${esc(r.zip?fmt6(r.zip):r.zipRaw)}</td><td>${esc(r.addrRaw)}</td><td>${resCell(r)}</td></tr>`).join('')}</tbody></table></div>`;

async function batchRun(){
  if(S.batch.running) return;
  if(!S.batch.rows.length) batchParse();
  if(!S.batch.rows.length){toast('붙여넣은 내용이 없습니다');return;}
  const todo=S.batch.rows.filter(r=>r.status==='ready'||r.status==='fail');
  if(!todo.length){toast('조회할 항목이 없습니다');return;}
  S.batch.running=true;S.batch.stop=false;renderBatch();
  const ctl=new AbortController();S.ctl=ctl;
  for(const r of todo){
    if(S.batch.stop) break;
    const q={zip:r.zip,addrRaw:r.addrRaw,nq:r.nq};
    const m=learnedMatch(Array.from(cache.values()),q.zip,q.nq.key);
    if(m.kind==='exact'||m.kind==='one'){
      const rec=m.recs[0];r.sel=rec.selected;r.cands=mergeCands([rec.selected],rec.candidates);r.status='learned';r.address2=rec.address2||r.address2;r.src='learned';
      await storeApply([],[{...rec,hits:(rec.hits||0)+1}],{silent:true});renderBatch();continue;
    }
    if(m.kind==='many'){
      r.cands=mergeCands([],m.recs.map(x=>x.selected));r.mainN=r.cands.length;r.status='pending';r.src='learned';renderBatch();continue;
    }
    r.status='running';renderBatch();
    try{
      if(BR.state==='wait') await waitBridge(2500);
      const viaBridge=bridgeReady();
      const list=viaBridge?(await lookupBridge(q,{},ctl)).cands:await lookupClaude(q,{},ctl);
      const rk=rankCandidates(list,q.nq);
      r.cands=[...rk.main,...rk.extras];r.mainN=rk.main.length;r.src=viaBridge?'bridge':'claude';
      if(r.cands.length){r.status='pending';r.note='';}else{r.status='fail';r.note='후보 없음';}
    }catch(e){
      r.status='fail';r.note=errText(e);
      if(e&&['not_granted','rate_limited','unavailable','sampling_disabled','session_expired','blocked','parse_failed'].includes(e.code)){S.batch.stop=true;toast(errText(e));}
    }
    renderBatch();
    if(!S.batch.stop) await sleep(bridgeReady()?Math.max(500,Number(BR.ext.limits.minIntervalMs)||500):500);
  }
  S.batch.running=false;renderBatch();
}
async function batchPick(n,i){
  const r=S.batch.rows.find(x=>x.n===n);if(!r||i===''||!r.cands[+i]) return;
  r.sel=r.cands[+i];r.status='done';
  await saveLearned(identOf({zip:r.zip,addrRaw:r.addrRaw,nq:r.nq}),r.sel,r.cands,r.address2);
  renderBatch();
}
async function batchAuto(){
  const rows=S.batch.rows.filter(autoOk);
  if(!rows.length) return;
  if(!S.batch.autoArm){S.batch.autoArm=true;renderBatch();setTimeout(()=>{S.batch.autoArm=false;renderBatch();},4000);return;}
  S.batch.autoArm=false;
  for(const r of rows){await batchPick(r.n,'0');}
  toast(`${rows.length}건을 확정했습니다`);
}
function batchOut(){
  return S.batch.rows.filter(r=>r.status==='learned'||r.status==='done').map(r=>({oldZip:r.zip?fmt6(r.zip):'',oldAddress:r.addrRaw,zip:r.sel.zip5,address1:r.sel.road,address2:r.address2||''}));
}

function learnFiltered(){
  const q=S.learn.q.trim().toLowerCase();const qd=q.replace(/\D/g,'');
  let list=Array.from(cache.values());
  if(q) list=list.filter(r=>[r.oldZip,fmt6(r.oldZip),r.addrKey,r.oldAddrRaw,r.selected.zip5,r.selected.road,r.selected.jibun,r.address2].some(v=>String(v||'').toLowerCase().includes(q))||(qd.length>=3&&(r.oldZip.includes(qd)||r.selected.zip5.includes(qd))));
  const s=S.learn.sort;
  list.sort((a,b)=>s==='hits'?b.hits-a.hits||b.updatedAt-a.updatedAt:s==='zip'?(a.oldZip.localeCompare(b.oldZip)||a.addrKey.localeCompare(b.addrKey)):b.updatedAt-a.updatedAt);
  return list;
}

      <div class="full"><label class="f" for="ed-cand">저장된 후보에서 선택</label><select id="ed-cand" data-act="ed-cand"><option value="">직접 입력</option>${r.candidates.map((k,i)=>`<option value="${i}" ${k.zip5===r.selected.zip5&&k.road===r.selected.road?'selected':''}>${esc(k.zip5)} ${esc(k.road)}</option>`).join('')}</select></div>
      <div><label class="f" for="ed-zip5">새우편번호</label><input type="text" id="ed-zip5" value="${esc(r.selected.zip5)}" maxlength="5" inputmode="numeric"></div>
      <div><label class="f" for="ed-road">도로명주소</label><input type="text" id="ed-road" value="${esc(r.selected.road)}"></div>
      <div><label class="f" for="ed-jibun">지번주소</label><input type="text" id="ed-jibun" value="${esc(r.selected.jibun||'')}"></div>
      <div><label class="f" for="ed-a2">상세주소</label><input type="text" id="ed-a2" value="${esc(r.address2||'')}"></div>
      <div><label class="f" for="ed-zip">구우편번호</label><input type="text" id="ed-zip" value="${esc(r.oldZip)}" maxlength="8"></div>
      <div><label class="f" for="ed-key">학습 키 (정규화된 구주소)</label><input type="text" id="ed-key" value="${esc(r.addrKey)}"></div>
      </div><div class="err" id="ed-err"></div>
      <div class="row" style="margin-top:8px"><button class="btn primary sm" data-act="learn-save" data-id="${esc(r.id)}">저장</button><button class="btn danger sm" data-act="learn-del-one" data-id="${esc(r.id)}">이 항목 삭제</button></div></td></tr>`;
    }
    return h;
  }).join('');
  const allOn=slice.length>0&&slice.every(r=>L.sel.has(r.id));
  $('#learnList').innerHTML=`<div class="tblwrap"><table><thead><tr><th><input type="checkbox" data-act="learn-sel-page" ${allOn?'checked':''} aria-label="현재 페이지 전체 선택"></th><th>구우편번호</th><th>구주소</th><th>선택한 새주소</th><th>사용</th><th>수정일</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="pager"><button class="btn sm" data-act="page" data-d="-1" ${L.page===0?'disabled':''}>이전</button><span class="small num">${L.page+1} / ${pages}</span><button class="btn sm" data-act="page" data-d="1" ${L.page>=pages-1?'disabled':''}>다음</button></div>`;
}
async function learnSave(id){
  const old=cache.get(id);if(!old) return;
  const err=m=>{$('#ed-err').textContent=m;};
  const zip5=$('#ed-zip5').value.trim(),road=$('#ed-road').value.trim();
  const oz=$('#ed-zip').value.replace(/\D/g,''),key=$('#ed-key').value.trim();
  if(!/^\d{5}$/.test(zip5)) return err('새우편번호는 5자리 숫자여야 합니다.');
  if(!road) return err('도로명주소를 입력하세요.');
  if(oz&&oz.length!==6) return err('구우편번호는 6자리 숫자여야 합니다.');
  if(!oz&&!key) return err('구우편번호나 학습 키 중 하나는 필요합니다.');
  const nid=recId(oz,key);
  if(nid!==id&&cache.has(nid)) return err('같은 구우편번호와 키를 가진 항목이 이미 있습니다. 그 항목을 먼저 삭제하세요.');
  const sel={zip5,road};const j=$('#ed-jibun').value.trim();if(j) sel.jibun=j;
  const rec={...old,id:nid,oldZip:oz,addrKey:key,selected:sel,address2:$('#ed-a2').value.trim(),candidates:mergeCands([sel],old.candidates),updatedAt:Date.now(),edited:true};
  await storeApply(nid!==id?[id]:[],[rec]);
  S.learn.open=null;renderLearn();toast('저장했습니다');
}

/* ---------------- 백업과 복원 ---------------- */
function renderBackup(){
  $('#backupInfo').textContent=`학습 ${cache.size}건 · 마지막 백업 ${META.lastBackupAt?fmtDate(META.lastBackupAt):'없음'} · 이후 변경 ${META.changes}건. 저장소는 이 브라우저에만 있으므로 백업이 유일한 이전 수단입니다.`;
  const u=S.undo;
  $('#undoBox').innerHTML=u?`<div class="panel"><p>전체 덮어쓰기 전 상태(${u.recs.length}건, ${esc(fmtDate(u.at))})로 되돌릴 수 있습니다. 이 창을 닫으면 사라집니다.</p><div class="row" style="margin-top:8px"><button class="btn" data-act="undo">되돌리기</button></div></div>`:'';
}
function exportJson(){
  return JSON.stringify({app:'postal-converter',schemaVersion:1,exportedAt:new Date().toISOString(),count:cache.size,records:Array.from(cache.values())});
}
async function markBackedUp(){META.lastBackupAt=Date.now();META.changes=0;await metaSave();renderBanner();renderBackup();}
async function exportFile(){
  const d=new Date();
  const name=`postal-learned-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const json=exportJson();
  try{
    const dl=await getDownloads();if(!dl) throw 0;
    await dl.save({filename:name,data:json});
    await markBackedUp();toast('내보냈습니다');
  }catch(e){
    if(e&&e.code==='declined') return;
    exportText(json);toast('다운로드를 쓸 수 없어 텍스트로 표시합니다');
  }
}
function exportText(json){
  $('#exportBox').hidden=false;$('#exportText').value=json||exportJson();
}
function impCheck(){
  const box=$('#impPreview');
  const txt=$('#impText').value.trim();
  if(!txt){box.innerHTML='<div class="notice err">파일을 선택하거나 JSON을 붙여넣으세요.</div>';S.imp=null;return;}
  let obj;try{obj=JSON.parse(txt);}catch(e){box.innerHTML='<div class="notice err">JSON 형식이 올바르지 않습니다. 기존 데이터는 변경되지 않았습니다.</div>';S.imp=null;return;}
  const v=validateBackup(obj);
  if(!v.ok){box.innerHTML=`<div class="notice err">${esc(v.err)} 기존 데이터는 변경되지 않았습니다.</div>`;S.imp=null;return;}
  let nw=[],same=0,conflicts=[];
  v.recs.forEach(r=>{const cur=cache.get(r.id);if(!cur) nw.push(r);else if(sameRec(r,cur)) same++;else conflicts.push({id:r.id,file:r,cur,pick:'newer'});});
  S.imp={recs:v.recs,nw,same,conflicts,skipped:v.skipped};renderImp();
}
function renderImp(){
  const I=S.imp;const box=$('#impPreview');if(!I){box.innerHTML='';return;}
  let h=`<div class="notice">파일 ${I.recs.length}건: 신규 <b class="num">${I.nw.length}</b> · 충돌 <b class="num">${I.conflicts.length}</b> · 동일 <b class="num">${I.same}</b>${I.skipped?` · 형식 오류로 건너뜀 <b class="num">${I.skipped}</b>`:''}</div>`;
  if(I.conflicts.length){
    h+=`<details class="more"><summary>충돌 ${I.conflicts.length}건 확인 (기본은 수정일이 더 최근인 쪽 유지)</summary><div class="tblwrap"><table><thead><tr><th>구주소</th><th>현재</th><th>파일</th><th>유지</th></tr></thead><tbody>${I.conflicts.map((c,i)=>`<tr><td>${esc(fmt6(c.file.oldZip))} ${esc(c.file.oldAddrRaw)}</td><td><span class="num">${esc(c.cur.selected.zip5)}</span> ${esc(c.cur.selected.road)}<div class="small">${esc(fmtDate(c.cur.updatedAt))}</div></td><td><span class="num">${esc(c.file.selected.zip5)}</span> ${esc(c.file.selected.road)}<div class="small">${esc(fmtDate(c.file.updatedAt))}</div></td><td><select data-act="imp-pick" data-i="${i}" aria-label="유지할 쪽"><option value="newer" ${c.pick==='newer'?'selected':''}>최근 수정</option><option value="file" ${c.pick==='file'?'selected':''}>파일</option><option value="current" ${c.pick==='current'?'selected':''}>현재</option></select></td></tr>`).join('')}</tbody></table></div></details>`;
  }
  h+=`<div class="row"><button class="btn primary" data-act="imp-merge" ${I.recs.length?'':'disabled'}>병합</button><button class="btn danger" data-act="imp-over-arm" ${I.recs.length?'':'disabled'}>전체 덮어쓰기</button></div><div id="overBox" hidden class="notice err" style="margin-top:10px"><p>현재 ${cache.size}건을 모두 삭제하고 파일의 ${I.recs.length}건으로 대체합니다. 실행 직전 상태는 이 창에서 한 번 되돌릴 수 있고, 아래 버튼으로 파일 백업도 받을 수 있습니다.</p><div class="row" style="margin-top:8px"><button class="btn sm" data-act="export-file">현재 데이터 먼저 내보내기</button><button class="btn danger sm" data-act="imp-over">덮어쓰기 실행</button></div></div>`;
  box.innerHTML=h;
}
async function impMerge(){
  const I=S.imp;if(!I) return;
  const put=[...I.nw];
  I.conflicts.forEach(c=>put.push(mergeRec(c.file,c.cur,c.pick)));
  const cut=I.conflicts.filter(c=>c.pick==='current').length;
  await storeApply([],put);
  toast(`병합했습니다 (추가 ${I.nw.length}, 충돌 처리 ${I.conflicts.length}${cut?`, 현재 유지 ${cut}`:''})`);
  S.imp=null;$('#impPreview').innerHTML='';$('#impText').value='';
}
async function impOver(){
  const I=S.imp;if(!I) return;
  S.undo={recs:Array.from(cache.values()),at:Date.now()};
  await storeApply([],I.recs,{clear:true});
  toast(`${I.recs.length}건으로 대체했습니다`);
  S.imp=null;$('#impPreview').innerHTML='';$('#impText').value='';renderBackup();
}
async function undo(){
  if(!S.undo) return;
  await storeApply([],S.undo.recs,{clear:true});
  S.undo=null;toast('이전 상태로 되돌렸습니다');renderBackup();
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t) return;
  const a=t.dataset.act;
  try{
    switch(a){
      case 'tab': setTab(t.dataset.tab);break;
      case 'mode': setMode(t.dataset.mode);break;
      case 'search': await runSingle(false);break;
      case 'research': await runSingle(true);break;
      case 'clear-single': $('#oldIn').value='';$('#addr2').value='';$('#zipErr').textContent='';S.cur=null;S.addr2Auto=true;renderResult();break;
      case 'cancel-lookup': if(S.ctl) S.ctl.abort();break;
      case 'relax': await doLookup(S.cur.q,{relaxed:true,via:S.cur.source==='claude'?'claude':'auto'});break;
      case 'claude-lookup': await doLookup(S.cur.q,{via:'claude'});break;
      case 'ext-ping': startPing();break;
      case 'diag-ping': startPing();bpost({type:'ping',id:uid()});renderDiag();break;
      case 'diag-clear': DIAG.length=0;renderDiag();break;
      case 'open-epost': if(t.dataset.q) copyText(t.dataset.q).then(ok=>{if(ok) toast('검색어를 복사했습니다');});break;
      case 'manual-open': S.cur.manualOpen=true;renderResult();break;
      case 'manual-close': S.cur.manualOpen=false;renderResult();break;
      case 'manual-parse': {
        const list=parseManualPaste($('#manualIn').value);
        if(!list.length){$('#manualErr').textContent='5자리 우편번호가 들어 있는 줄을 찾지 못했습니다. 우체국 결과를 그대로 붙여넣었는지 확인하세요.';break;}
        const r=rankCandidates(list,S.cur.q.nq);
        S.cur.source='manual';S.cur.cands=[...r.main,...r.extras];S.cur.mainN=r.main.length;S.cur.sel=-1;S.cur.error='';S.cur.manualOpen=false;S.cur.extrasOpen=r.main.length===0;
        renderResult();break;}
      case 'use-rec': {const rec=cache.get(t.dataset.id);if(rec){$('#oldIn').value=(rec.oldZip?fmt6(rec.oldZip)+' ':'')+rec.oldAddrRaw;await showLearned(rec,{zip:rec.oldZip,addrRaw:rec.oldAddrRaw,nq:normAddr(rec.oldAddrRaw)});}break;}
      case 'copy': await copyKind(t.dataset.k);break;
      case 'fb-close': $('#fallback').hidden=true;break;
      case 'batch-parse': batchParse();break;
      case 'batch-run': await batchRun();break;
      case 'batch-stop': S.batch.stop=true;if(S.ctl) S.ctl.abort();break;
      case 'batch-clear': S.batch.rows=[];$('#batchIn').value='';renderBatch();break;
      case 'batch-retry': await batchRun();break;
      case 'batch-auto': await batchAuto();break;
      case 'batch-copy-json': await doCopy(JSON.stringify(batchOut(),null,1),'JSON');break;
      case 'batch-copy-tsv': await doCopy(['구우편번호','구주소','새우편번호','주소1','주소2'].join('\t')+'\n'+batchOut().map(o=>[o.oldZip,o.oldAddress,o.zip,o.address1,o.address2].join('\t')).join('\n'),'TSV');break;
      case 'learn-edit': S.learn.open=S.learn.open===t.dataset.id?null:t.dataset.id;renderLearn();break;
      case 'learn-save': await learnSave(t.dataset.id);break;
      case 'learn-del-one': await storeApply([t.dataset.id],[]);S.learn.open=null;S.learn.sel.delete(t.dataset.id);toast('삭제했습니다');break;
      case 'learn-sel': t.checked?S.learn.sel.add(t.dataset.id):S.learn.sel.delete(t.dataset.id);S.learn.delArm=false;renderLearn();break;
      case 'learn-sel-page': {const L=S.learn;const list=learnFiltered().slice(L.page*PAGE,L.page*PAGE+PAGE);list.forEach(r=>t.checked?L.sel.add(r.id):L.sel.delete(r.id));L.delArm=false;renderLearn();break;}
      case 'learn-del': {
        const L=S.learn;
        if(!L.delArm){L.delArm=true;renderLearn();setTimeout(()=>{L.delArm=false;renderLearn();},4000);break;}
        const ids=Array.from(L.sel);L.sel.clear();L.delArm=false;await storeApply(ids,[]);toast(`${ids.length}건 삭제했습니다`);break;}
      case 'learn-reset-open': $('#resetBox').hidden=false;$('#resetConfirm').value='';break;
      case 'learn-reset-cancel': $('#resetBox').hidden=true;break;
      case 'learn-reset':
        if($('#resetConfirm').value.trim()!=='삭제'){toast('확인 문구로 삭제 라고 입력하세요');break;}
        await storeApply([],[],{clear:true});S.learn.sel.clear();$('#resetBox').hidden=true;toast('초기화했습니다');break;
      case 'page': S.learn.page=Math.max(0,S.learn.page+Number(t.dataset.d));renderLearn();break;
      case 'export-file': await exportFile();break;
      case 'export-text': exportText();break;
      case 'export-copy': await doCopy($('#exportText').value,'JSON');await markBackedUp();break;
      case 'imp-check': impCheck();break;
      case 'imp-merge': await impMerge();break;
      case 'imp-over-arm': $('#overBox').hidden=false;break;
      case 'imp-over': await impOver();break;
      case 'undo': await undo();break;
    }
  }catch(err){console.error(err);toast('처리 중 오류가 발생했습니다');}
});
document.addEventListener('change',async e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;if(!a) return;
  if(a==='pick'&&t.checked) await pickCand(Number(t.dataset.i));
  else if(a==='batch-pick') await batchPick(Number(t.dataset.n),t.value);
  else if(a==='ed-cand'){
    const id=S.learn.open;const rec=cache.get(id);if(!rec||t.value==='') return;
    const k=rec.candidates[Number(t.value)];if(!k) return;
    $('#ed-zip5').value=k.zip5;$('#ed-road').value=k.road;$('#ed-jibun').value=k.jibun||'';
  }
  else if(a==='ai-tier'){AI.tier=t.value==='default'?'default':'quick';try{localStorage.setItem('pc-ai-tier',AI.tier);}catch(err){}toast('AI 모델: '+(AI.tier==='quick'?'Haiku':'Sonnet'));}
  else if(a==='imp-pick'){S.imp.conflicts[Number(t.dataset.i)].pick=t.value;}
  else if(a==='learn-sel'||a==='learn-sel-page') return;
});
document.addEventListener('toggle',e=>{if(e.target.id==='extras'&&S.cur) S.cur.extrasOpen=e.target.open;},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='oldIn'){e.preventDefault();runSingle(false);}
});
$('#addr2').addEventListener('input',()=>{S.addr2Auto=false;if(S.cur&&S.cur.sel>=0) renderResult();});
$('#oldIn').addEventListener('input',()=>{$('#zipErr').textContent='';});
$('#learnQ').addEventListener('input',e=>{S.learn.q=e.target.value;S.learn.page=0;renderLearn();});
$('#learnSort').addEventListener('change',e=>{S.learn.sort=e.target.value;S.learn.page=0;renderLearn();});
$('#impFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f) return;
  try{$('#impText').value=await f.text();impCheck();}catch(err){$('#impPreview').innerHTML='<div class="notice err">파일을 읽지 못했습니다.</div>';}
});

/* ---------------- 시작 ---------------- */
(async function init(){
  renderSources();renderBatch();renderStatus();
  $('#aiTier').value=AI.tier;
  startPing();
  sendReady('init');
  await storeInit();
  updateCounts();renderBanner();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  const s=await getSample();S.sampleState=s?'ok':'off';renderSources();
})();
</script>
